<div class="access-repuestos-form" style="display: flex; flex-direction: column; height: 100%; box-sizing: border-box; background-color: #F0F0F0; color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px;">
  
  <!-- Form Header -->
  <div style="background-color: #E2E4E7; border-bottom: 1px solid #A0A0A0; padding: 12px 15px; display: flex; align-items: center; gap: 10px;">
    <div style="background: linear-gradient(to bottom, #E85A5A, #B02020); color: #fff; width: 28px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; border: 1px solid #701010; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);">
      📄
    </div>
    <span style="font-size: 18px; font-weight: bold; color: #3A4F6B;">repuestos mega</span>
  </div>

  <!-- Form Body -->
  <div style="padding: 25px; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; max-width: 700px;">
    
    <!-- Id -->
    <div style="display: flex; align-items: center;">
      <span style="width: 150px; color: #555;">Id</span>
      <input type="text" id="rep-id" readonly style="width: 450px; height: 24px; border: 1px solid #C0C0C0; background-color: #EAEAEA; padding-left: 6px; outline: none;">
    </div>

    <!-- fecha -->
    <div style="display: flex; align-items: center;">
      <span style="width: 150px; color: #555;">fecha</span>
      <input type="text" id="rep-fecha" style="width: 450px; height: 24px; border: 1px solid #C0C0C0; background-color: #FFF; padding-left: 6px; outline: none;">
    </div>

    <!-- repuesto denominación -->
    <div style="display: flex; align-items: center;">
      <span style="width: 150px; color: #555;">repuesto denominación</span>
      <input type="text" id="rep-denominacion" style="width: 450px; height: 24px; border: 1px solid #C0C0C0; background-color: #FFF; padding-left: 6px; outline: none;">
    </div>

    <!-- codigo repuesto -->
    <div style="display: flex; align-items: center;">
      <span style="width: 150px; color: #555;">codigo repuesto</span>
      <input type="text" id="rep-codigo-rep" style="width: 450px; height: 24px; border: 1px solid #C0C0C0; background-color: #FFF; padding-left: 6px; outline: none;">
    </div>

    <!-- codigo proveedor -->
    <div style="display: flex; align-items: center;">
      <span style="width: 150px; color: #555;">codigo proveedor</span>
      <input type="text" id="rep-codigo-prov" style="width: 450px; height: 24px; border: 1px solid #C0C0C0; background-color: #FFF; padding-left: 6px; outline: none;">
    </div>

    <!-- precio -->
    <div style="display: flex; align-items: center;">
      <span style="width: 150px; color: #555;">precio</span>
      <input type="text" id="rep-precio" style="width: 450px; height: 24px; border: 1px solid #C0C0C0; background-color: #FFF; padding-left: 6px; outline: none;">
    </div>

  </div>

  <!-- Access Form Navigation Status Bar (bottom) -->
  <div style="background-color: #E2E4E7; border-top: 1px solid #A0A0A0; padding: 6px 15px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; select: none;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <span style="color: #444; margin-right: 4px;">Registro:</span>
      <!-- First Record -->
      <button id="rep-nav-first" style="width: 24px; height: 22px; border: 1px solid #B0B0B0; background: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px;">|◀</button>
      <!-- Prev Record -->
      <button id="rep-nav-prev" style="width: 24px; height: 22px; border: 1px solid #B0B0B0; background: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px;">◀</button>
      <!-- Index display box -->
      <input type="text" id="rep-nav-current" value="1" style="width: 40px; height: 22px; text-align: center; border: 1px solid #B0B0B0; margin: 0 4px;">
      <!-- Total count -->
      <span id="rep-nav-total" style="color: #444;">de 7</span>
      <!-- Next Record -->
      <button id="rep-nav-next" style="width: 24px; height: 22px; border: 1px solid #B0B0B0; background: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px;">▶</button>
      <!-- Last Record -->
      <button id="rep-nav-last" style="width: 24px; height: 22px; border: 1px solid #B0B0B0; background: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px;">▶|</button>
      <!-- New/Add Record -->
      <button id="rep-nav-new" style="width: 24px; height: 22px; border: 1px solid #B0B0B0; background: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; margin-left: 6px;">📄✨</button>
      
      <!-- Save button -->
      <button id="rep-nav-save" style="margin-left: 10px; height: 22px; padding: 0 8px; border: 1px solid #28a745; background-color: #28a745; color: white; cursor: pointer; border-radius: 2px; font-weight: bold; font-size: 11px;">
        Guardar
      </button>
    </div>
    
    <!-- Search block on the right -->
    <div style="display: flex; align-items: center; gap: 4px;">
      <span style="color: #444;">Buscar:</span>
      <input type="text" id="rep-search-input" placeholder="Escribe para buscar..." style="width: 180px; height: 22px; border: 1px solid #B0B0B0; padding-left: 4px;">
    </div>
  </div>

</div>
