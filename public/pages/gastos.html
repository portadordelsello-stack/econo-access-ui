<div class="access-gastos-form" style="display: flex; flex-direction: column; height: 100%; width: 100%; box-sizing: border-box; background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  
  <!-- Header Bar -->
  <div class="gastos-form-header" style="background-color: #7D6054; height: 42px; display: flex; align-items: center; padding-left: 15px; box-sizing: border-box; border-bottom: 1px solid #5a433a;">
    <span style="font-size: 20px; font-weight: bold; letter-spacing: 1px;">GASTOS</span>
  </div>

  <!-- Form Body -->
  <div class="gastos-form-body" style="flex-grow: 1; padding: 25px; position: relative; box-sizing: border-box; display: flex; flex-direction: row; gap: 40px; overflow-y: auto;">
    
    <!-- Left Column (Yellow border group) -->
    <div style="border: 2px solid #FFFF00; padding: 15px; width: 380px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background-color: #000;">
      
      <!-- Fecha -->
      <div style="display: flex; align-items: center;">
        <label style="width: 100px; color: #FF4D4D; font-weight: bold; font-size: 14px;">fecha</label>
        <div style="display: flex; flex-grow: 1; align-items: center; background-color: #fff; border: 1px solid #777; height: 24px; box-sizing: border-box;">
          <input type="text" id="gas-fecha" style="border: none; outline: none; background: transparent; width: 100%; padding-left: 5px; color: #000; font-size: 13px;">
          <button id="btn-calendar" style="border: none; background: transparent; cursor: pointer; display: flex; align-items: center; padding: 0 4px;">
            📅
          </button>
        </div>
      </div>

      <!-- Parcial -->
      <div style="display: flex; align-items: center;">
        <label style="width: 100px; color: #FF4D4D; font-weight: bold; font-size: 14px;">parcial</label>
        <div style="display: flex; flex-grow: 1; border: 1px solid #FFFF00; background-color: #000; height: 24px; box-sizing: border-box;">
          <input type="text" id="gas-parcial" style="border: none; outline: none; background: transparent; width: 100%; padding-left: 5px; color: #fff; font-size: 13px;">
        </div>
      </div>

      <!-- Sumar -->
      <div style="display: flex; align-items: center;">
        <label style="width: 100px; color: #739AC7; font-weight: bold; font-size: 14px;">sumar</label>
        <div style="display: flex; flex-grow: 1; border: 1px solid #FFFF00; background-color: #000; height: 24px; box-sizing: border-box;">
          <span style="color: #739AC7; padding-left: 5px; font-size: 13px; display: flex; align-items: center; user-select: none;">$</span>
          <input type="text" id="gas-sumar" style="border: none; outline: none; background: transparent; width: 100%; padding-left: 2px; color: #fff; font-size: 13px;">
        </div>
      </div>

      <!-- Restar -->
      <div style="display: flex; align-items: center;">
        <label style="width: 100px; color: #739AC7; font-weight: bold; font-size: 14px;">restar</label>
        <div style="display: flex; flex-grow: 1; border: 1px solid #FFFF00; background-color: #000; height: 24px; box-sizing: border-box;">
          <span style="color: #739AC7; padding-left: 5px; font-size: 13px; display: flex; align-items: center; user-select: none;">$</span>
          <input type="text" id="gas-restar" style="border: none; outline: none; background: transparent; width: 100%; padding-left: 2px; color: #fff; font-size: 13px;">
        </div>
      </div>

      <!-- Descripción -->
      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; align-items: flex-start;">
          <label style="width: 100px; color: #FF4D4D; font-weight: bold; font-size: 14px;">descripción</label>
          <textarea id="gas-desc" style="flex-grow: 1; height: 80px; background-color: #B4C6DF; color: #000; font-family: inherit; font-size: 13px; padding: 5px; border: 1px solid #777; resize: none; box-sizing: border-box; outline: none;"></textarea>
        </div>
      </div>

      <!-- Proveedor -->
      <div style="display: flex; align-items: center; margin-top: 5px;">
        <label style="width: 100px; color: #FF4D4D; font-weight: bold; font-size: 14px;">proveedor</label>
        <select id="gas-proveedor" style="flex-grow: 1; height: 24px; background-color: #B4C6DF; color: #000; font-size: 13px; border: 1px solid #777; outline: none; box-sizing: border-box;">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Gasto -->
      <div style="display: flex; align-items: center;">
        <label style="width: 100px; color: #739AC7; font-weight: bold; font-size: 14px;">gasto</label>
        <div style="display: flex; flex-grow: 1; border: 1px solid #FFFF00; background-color: #000; height: 24px; box-sizing: border-box;">
          <input type="text" id="gas-total-gasto" readonly style="border: none; outline: none; background: transparent; width: 100%; padding-left: 5px; color: #FFFF00; font-size: 13px; font-weight: bold;">
        </div>
      </div>

    </div>

    <!-- Right Column (Checkboxes and Rubro) -->
    <div style="display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; padding-top: 10px; width: 250px;">
      
      <!-- econo Checkbox -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="gas-econoservice" style="transform: scale(1.3); cursor: pointer; margin: 0;">
        <div style="background-color: #B4C6DF; color: #fff; padding: 2px 10px; font-size: 14px; font-weight: bold; border: 1px solid #777; width: 80px; box-sizing: border-box; text-align: center; color: #000; user-select: none;">
          econo
        </div>
      </div>

      <!-- fa Checkbox -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="gas-fa" style="transform: scale(1.3); cursor: pointer; margin: 0;">
        <div style="background-color: #B4C6DF; color: #fff; padding: 2px 10px; font-size: 14px; font-weight: bold; border: 1px solid #777; width: 80px; box-sizing: border-box; text-align: center; color: #000; user-select: none;">
          fa
        </div>
      </div>

      <!-- rubro selector -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 20px;">
        <div style="background-color: #B4C6DF; color: #000; padding: 2px 8px; font-size: 13px; font-weight: bold; border: 1px solid #777; box-sizing: border-box; user-select: none;">
          rubro:
        </div>
        <select id="gas-rubro" style="width: 140px; height: 24px; background-color: #fff; color: #000; font-size: 13px; border: 1px solid #777; outline: none; box-sizing: border-box;">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Save & Delete actions -->
      <div style="display: flex; gap: 10px; margin-top: 30px;">
        <button id="gas-save-btn" style="flex-grow: 1; padding: 5px 10px; font-size: 12px; font-weight: bold; color: #000; background-color: #D3D3D3; border: 1px solid #777; cursor: pointer; border-radius: 3px;">
          Guardar Registro
        </button>
        <button id="gas-delete-btn" style="padding: 5px 10px; font-size: 12px; font-weight: bold; color: #fff; background-color: #D24726; border: 1px solid #b83b1d; cursor: pointer; border-radius: 3px;">
          Eliminar
        </button>
      </div>

    </div>

    <!-- Center Control Buttons (Record navigations) -->
    <div style="position: absolute; bottom: 80px; left: 25px; display: flex; align-items: center; gap: 12px;">
      <!-- Nav custom buttons -->
      <button id="btn-prev" style="width: 32px; height: 26px; font-size: 14px; font-weight: bold; background-color: #D3D3D3; border: 1px solid #777; border-radius: 3px; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center;">
        ◀
      </button>
      <button id="btn-next" style="width: 32px; height: 26px; font-size: 14px; font-weight: bold; background-color: #D3D3D3; border: 1px solid #777; border-radius: 3px; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center;">
        ▶
      </button>
      <button id="btn-last" style="width: 32px; height: 26px; font-size: 14px; font-weight: bold; background-color: #D3D3D3; border: 1px solid #777; border-radius: 3px; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center;">
        ▶|
      </button>
      
      <!-- New record icon-like button -->
      <button id="btn-new" title="Nuevo Registro" style="width: 36px; height: 26px; font-size: 14px; font-weight: bold; background-color: #fff; border: 1px solid #777; border-radius: 3px; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center; margin-left: 20px;">
        📄✨
      </button>
    </div>

  </div>

  <!-- Access Status Record Nav Bar at the bottom -->
  <div class="access-datasheet-nav-bar" id="gas-record-nav" style="border-top: 1px solid #999; background-color: #E3E3E3; color: #000; font-family: Tahoma, sans-serif; font-size: 11px; padding: 4px 6px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; height: 28px; user-select: none;">
    <!-- Standard Access navbar content will be generated dynamically -->
  </div>

</div>
